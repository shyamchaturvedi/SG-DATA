<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Data Portal | Premium Business Intelligence</title>
    <!-- Android/PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Passcode Overlay -->
    <div id="passcodeOverlay" class="overlay">
        <div class="glass-card login-card">
            <div class="icon-header">
                <i data-lucide="lock" class="lock-icon"></i>
            </div>
            <h2>Secure Access</h2>
            <p>Please enter your access code to proceed</p>
            <div class="input-group-vertical">
                <input type="email" id="emailInput" placeholder="Your Admin Email" required>
                <input type="password" id="passwordInput" placeholder="••••••••" required>
                <button id="loginButton" class="btn-primary">
                    <span>Login</span>
                    <i data-lucide="log-in"></i>
                </button>
            </div>
            <div id="loginFeedback" class="feedback"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainApp" class="container hidden">
        <header class="app-header">
            <div class="logo-area">
                <i data-lucide="database" class="header-icon"></i>
                <h1>SG DATA <span>PORTAL</span></h1>
            </div>
            <div class="header-actions">
                <button id="settingsButton" class="btn-ghost hidden" title="Settings">
                    <i data-lucide="settings"></i>
                </button>
                <button id="logoutButton" class="btn-ghost" title="Logout">
                    <i data-lucide="log-out"></i>
                </button>
            </div>
        </header>

        <main class="app-content">
            <section class="search-section">
                <div class="glass-card search-card">
                    <div class="search-title">
                        <h2>Client Database <span>Search</span></h2>
                        <p>Search over thousands of records instantly</p>
                    </div>
                    <div class="search-input-wrapper">
                        <i data-lucide="search" class="search-icon"></i>
                        <input type="text" id="searchInput" placeholder="Enter customer name or ID...">
                        <button id="searchButton" class="btn-primary">Search</button>
                    </div>
                    <button id="printButton" class="btn-secondary hidden" title="Print Results">
                        <i data-lucide="printer"></i>
                        <span>Print Sheet</span>
                    </button>
                </div>
            </section>

            <section class="results-section">
                <div id="customerHeader" class="customer-info hidden">
                    <h2 id="customerDisplayName">STEFANIE CHASE</h2>
                </div>

                <div class="table-wrapper glass-card">
                    <table id="resultTable">
                        <thead id="tableHead"></thead>
                        <tbody></tbody>
                    </table>
                    <div id="noResults" class="no-records hidden">
                        <i data-lucide="info"></i>
                        <p>No records found. Please refine your search.</p>
                    </div>
                <div class="print-only-footer">
                    <p>--- END OF REPORT ---</p>
                </div>
            </section>
        </main>

    </div>



    <!-- Passcode Update Modal -->
    <div id="settingsModal" class="overlay hidden">
        <div class="glass-card login-card">
            <div class="icon-header">
                <i data-lucide="shield-check" class="lock-icon"></i>
            </div>
            <h2>Update Passcode</h2>
            <p>Enter current and new access code</p>
            <div class="input-group-vertical">
                <input type="password" id="currentPasscodeInput" placeholder="Current Code" maxlength="30">
                <input type="password" id="newPasscodeInput" placeholder="New Code (min 4 chars)" maxlength="30">
                <div class="modal-actions">
                    <button id="closeSettingsButton" class="btn-secondary">Cancel</button>
                    <button id="savePasscodeButton" class="btn-primary">Update</button>
                </div>
            </div>
            <div id="settingsFeedback" class="feedback"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
