<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Data Portal | Premium Business Intelligence</title>
    <!-- Android/PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Passcode Overlay -->
    <div id="passcodeOverlay" class="overlay">
        <div class="glass-card login-card">
            <div class="icon-header">
                <i data-lucide="lock" class="lock-icon"></i>
            </div>
            <h2>Secure Access</h2>
            <p>Please enter your access code to proceed</p>
            <div class="input-group">
                <input type="password" id="passcodeInput" placeholder="•••••" maxlength="10">
                <button id="unlockButton">
                    <span>Unlock</span>
                    <i data-lucide="arrow-right"></i>
                </button>
            </div>
            <div id="loginFeedback" class="feedback"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainApp" class="container hidden">
        <header class="app-header">
            <div class="logo-area">
                <i data-lucide="database" class="header-icon"></i>
                <h1>SG DATA <span>PORTAL</span></h1>
            </div>
            <div class="header-actions">
                <button id="logoutButton" class="btn-ghost">
                    <i data-lucide="log-out"></i>
                    <span>Lock</span>
                </button>
            </div>
        </header>

        <section class="search-section">
            <div class="glass-card search-card">
                <div class="search-input-wrapper">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search by Customer Name, ID, or Associate ID...">
                    <button id="searchButton" class="btn-primary">Search</button>
                    <button id="printButton" class="btn-secondary hidden" title="Print Results">
                        <i data-lucide="printer"></i>
                    </button>
                </div>
            </div>
        </section>

        <section class="results-section">
            <div id="customerHeader" class="customer-info hidden">
                <h2 id="customerDisplayName">STEFANIE CHASE</h2>
            </div>
            
            <div class="table-wrapper glass-card">
                <table id="resultTable">
                    <thead id="tableHead">
                        <!-- Dynamic Header -->
                    </thead>
                    <tbody>
                        <!-- Dynamic Content -->
                    </tbody>
                </table>
                <div id="noResults" class="no-records hidden">
                    <i data-lucide="info"></i>
                    <p>No records found. Please refine your search.</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer for Prints -->
    <footer class="print-footer">
        <p>© 2026 SG Data Portal - All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
